<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Six ways to search: web, images, videos, maps, news, and shopping">
  <style>
    .bar { fill:#fff; stroke:#0b5394; stroke-width:3; }
    .tile { fill:#dbe7f5; stroke:#0b5394; stroke-width:3; }
    .ic { fill:#0b5394; }
    .t { fill:#14213d; font:600 15px system-ui, sans-serif; text-anchor:middle; }
  </style>

  <!-- Search bar -->
  <rect class="bar" x="170" y="20" width="380" height="44" rx="22"/>
  <circle cx="205" cy="42" r="11" fill="none" stroke="#0b5394" stroke-width="3"/>
  <line x1="213" y1="50" x2="224" y2="61" stroke="#0b5394" stroke-width="3"/>
  <text class="t" x="380" y="47" style="fill:#4a5568">search here…</text>

  <!-- Row 1 -->
  <g>
    <rect class="tile" x="60" y="100" width="170" height="80" rx="10"/>
    <text class="t" x="145" y="148">Web</text>
    <rect class="tile" x="275" y="100" width="170" height="80" rx="10"/>
    <text class="t" x="360" y="148">Images</text>
    <rect class="tile" x="490" y="100" width="170" height="80" rx="10"/>
    <text class="t" x="575" y="148">Videos</text>
  </g>
  <!-- Row 2 -->
  <g>
    <rect class="tile" x="60" y="210" width="170" height="80" rx="10"/>
    <text class="t" x="145" y="258">Maps</text>
    <rect class="tile" x="275" y="210" width="170" height="80" rx="10"/>
    <text class="t" x="360" y="258">News</text>
    <rect class="tile" x="490" y="210" width="170" height="80" rx="10"/>
    <text class="t" x="575" y="258">Shopping</text>
  </g>
</svg>
