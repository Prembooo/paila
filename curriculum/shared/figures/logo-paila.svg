    <!-- toes -->
    <polygon points="13,14 18,11 19,16 14,18" fill="#4338ca"/>
    <polygon points="22,9 27,8 27,14 22,15" fill="#4f46e5"/>
    <polygon points="30,9 35,10 34,16 29,15" fill="#6d28d9"/>
