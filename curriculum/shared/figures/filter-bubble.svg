<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="A filter bubble: you see more of the same; other things stay outside">
  <style>
    .bubble { fill:#eef2fb; stroke:#3730a3; stroke-width:3; }
    .same { fill:#3730a3; }
    .out { fill:#c9d2dd; }
    .t { font:700 16px system-ui, sans-serif; fill:#14213d; }
    .s { font:400 14px system-ui, sans-serif; fill:#5a6275; }
  </style>
  <!-- outside items (missed) -->
  <circle class="out" cx="60" cy="60" r="18"/>
  <rect class="out" x="42" y="150" width="36" height="36" rx="6"/>
  <circle class="out" cx="660" cy="70" r="18"/>
  <rect class="out" x="642" y="150" width="36" height="36" rx="6"/>
  <text class="s" x="40" y="210">other things</text>
  <text class="s" x="600" y="210">stay outside</text>

  <!-- the bubble: more of the same -->
  <circle class="bubble" cx="360" cy="115" r="92"/>
  <rect class="same" x="318" y="78" width="26" height="26" rx="5"/>
  <rect class="same" x="354" y="78" width="26" height="26" rx="5"/>
  <rect class="same" x="318" y="112" width="26" height="26" rx="5"/>
  <rect class="same" x="354" y="112" width="26" height="26" rx="5"/>
  <text class="t" x="360" y="172" text-anchor="middle">more of the same</text>
</svg>
