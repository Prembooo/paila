<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Fact versus opinion: a fact can be checked; an opinion is what someone feels or thinks">
  <style>
    .fact { fill:#eaf5ee; stroke:#1b7a3d; stroke-width:3; }
    .op { fill:#eef2fb; stroke:#0b5394; stroke-width:3; }
    .h { font:700 22px system-ui, sans-serif; text-anchor:middle; }
    .s { font:400 15px system-ui, sans-serif; text-anchor:middle; fill:#4a5568; }
    .line { stroke:#9bb4d4; stroke-width:6; stroke-linecap:round; }
  </style>

  <!-- Fact panel -->
  <rect class="fact" x="30" y="40" width="300" height="220" rx="14"/>
  <text class="h" x="180" y="80" fill="#1b7a3d">Fact</text>
  <circle cx="100" cy="120" r="16" fill="none" stroke="#1b7a3d" stroke-width="4"/>
  <path d="M92 120 l6 7 l12 -15" fill="none" stroke="#1b7a3d" stroke-width="4"/>
  <line class="line" x1="135" y1="120" x2="300" y2="120"/>
  <line class="line" x1="60" y1="160" x2="300" y2="160"/>
  <line class="line" x1="60" y1="195" x2="270" y2="195"/>
  <text class="s" x="180" y="240">You can check it. It is true or false.</text>

  <!-- Opinion panel -->
  <rect class="op" x="390" y="40" width="300" height="220" rx="14"/>
  <text class="h" x="540" y="80" fill="#0b5394">Opinion</text>
  <path d="M470 120 a18 18 0 1 1 18 18 h-6 v14 l-12 -14 a18 18 0 0 1 0 -18 z" fill="#dbe7f5" stroke="#0b5394" stroke-width="3"/>
  <line class="line" x1="150" y1="0" x2="150" y2="0"/>
  <line class="line" x1="520" y1="160" x2="660" y2="160"/>
  <line class="line" x1="420" y1="195" x2="640" y2="195"/>
  <text class="s" x="540" y="240">What a person feels or likes.</text>
</svg>
