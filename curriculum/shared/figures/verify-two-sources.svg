<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Check a claim against two independent sources before you trust it">
  <style>
    .claim { fill:#fff4e5; stroke:#d35400; stroke-width:3; }
    .src { fill:#eaf2fb; stroke:#0b5394; stroke-width:3; }
    .flow { stroke:#0b5394; stroke-width:4; fill:none; marker-end:url(#a2); }
    .t { font:700 16px system-ui, sans-serif; text-anchor:middle; fill:#14213d; }
    .s { font:400 13px system-ui, sans-serif; text-anchor:middle; fill:#4a5568; }
  </style>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0b5394"/>
    </marker>
  </defs>

  <!-- Claim -->
  <rect class="claim" x="270" y="30" width="180" height="64" rx="10"/>
  <text class="t" x="360" y="60">A claim</text>
  <text class="s" x="360" y="80">something you read</text>

  <!-- Two sources -->
  <rect class="src" x="60" y="190" width="220" height="74" rx="10"/>
  <text class="t" x="170" y="222">Source 1</text>
  <text class="s" x="170" y="244">a trusted place</text>

  <rect class="src" x="440" y="190" width="220" height="74" rx="10"/>
  <text class="t" x="550" y="222">Source 2</text>
  <text class="s" x="550" y="244">a different trusted place</text>

  <!-- Arrows -->
  <path class="flow" d="M330 96 L190 186"/>
  <path class="flow" d="M390 96 L530 186"/>

  <text class="s" x="360" y="150" style="font-size:15px; fill:#1b7a3d; font-weight:700">Do both sources agree? Then trust it.</text>
</svg>
