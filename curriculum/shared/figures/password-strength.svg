<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="A weak password is short and simple; a strong password is long and mixed">
  <style>
    .weak { fill:#fdeaea; stroke:#c0392b; stroke-width:3; }
    .strong { fill:#eaf5ee; stroke:#1b7a3d; stroke-width:3; }
    .h { font:700 20px system-ui, sans-serif; text-anchor:middle; }
    .code { font:700 18px monospace; text-anchor:middle; fill:#14213d; }
    .s { font:400 14px system-ui, sans-serif; text-anchor:middle; fill:#4a5568; }
  </style>
  <rect class="weak" x="30" y="40" width="300" height="160" rx="14"/>
  <text class="h" x="180" y="76" fill="#c0392b">Weak</text>
  <text class="code" x="180" y="120">12345</text>
  <text class="s" x="180" y="155">Short. Easy to guess.</text>

  <rect class="strong" x="390" y="40" width="300" height="160" rx="14"/>
  <text class="h" x="540" y="76" fill="#1b7a3d">Strong</text>
  <text class="code" x="540" y="120">Sun#Goat42</text>
  <text class="s" x="540" y="150">8+ letters, numbers, a symbol.</text>
  <text class="s" x="540" y="172">Easy for you, hard for others.</text>
</svg>
