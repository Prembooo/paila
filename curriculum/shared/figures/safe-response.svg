<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="If something feels unsafe: stop, do not share, and ask a trusted person">
  <style>
    .box { fill:#fff4e5; stroke:#d35400; stroke-width:3; }
    .n { fill:#d35400; } .nt { fill:#fff; font:bold 18px system-ui, sans-serif; text-anchor:middle; }
    .t { font:700 17px system-ui, sans-serif; text-anchor:middle; fill:#14213d; }
    .flow { stroke:#d35400; stroke-width:4; fill:none; marker-end:url(#ar); }
  </style>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d35400"/></marker></defs>

  <rect class="box" x="20" y="60" width="190" height="90" rx="12"/>
  <circle class="n" cx="50" cy="90" r="16"/><text class="nt" x="50" y="96">1</text>
  <text class="t" x="125" y="120">Stop</text>

  <rect class="box" x="265" y="60" width="190" height="90" rx="12"/>
  <circle class="n" cx="295" cy="90" r="16"/><text class="nt" x="295" y="96">2</text>
  <text class="t" x="370" y="112">Do not share</text>
  <text class="t" x="370" y="134" style="font-size:13px; font-weight:400; fill:#4a5568">money, OTP, password</text>

  <rect class="box" x="510" y="60" width="190" height="90" rx="12"/>
  <circle class="n" cx="540" cy="90" r="16"/><text class="nt" x="540" y="96">3</text>
  <text class="t" x="615" y="112">Ask someone</text>
  <text class="t" x="615" y="134" style="font-size:13px; font-weight:400; fill:#4a5568">you trust</text>

  <path class="flow" d="M212 105 H262"/>
  <path class="flow" d="M457 105 H507"/>
</svg>
