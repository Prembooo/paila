<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Paila">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Paila polygonal footprint, scaled + centered, in white to read on the dark tile -->
  <g transform="translate(92.8,44.8) scale(6.4)">
    <!-- toes -->
    <polygon points="13,14 18,11 19,16 14,18" fill="#ffffff"/>
    <polygon points="22,9 27,8 27,14 22,15" fill="#ffffff"/>
    <polygon points="30,9 35,10 34,16 29,15" fill="#ede9fe"/>
    <polygon points="38,12 42,15 40,20 35,18" fill="#ede9fe"/>
    <!-- ball pad (faceted) -->
    <polygon points="12,22 26,18 39,24 34,38 16,39 9,30" fill="#ffffff"/>
    <polygon points="26,18 39,24 34,38 27,29" fill="#c4b5fd"/>
    <!-- heel (faceted) -->
    <polygon points="18,44 31,43 28,58 21,58" fill="#ffffff"/>
    <polygon points="31,43 28,58 26,50" fill="#c4b5fd"/>
  </g>
</svg>
